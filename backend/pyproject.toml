[project]
name = "accrueboard"
version = "0.1.0"
description = "Bookkeeping AI pipeline with a real-time board for human and AI task coordination."
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdfium2>=5.13.0",
    "pyyaml>=6.0.3",
    "reportlab>=5.0.1",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
accrueboard = "accrueboard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accrueboard"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "S", "DTZ", "PT", "RET", "ARG", "PL", "TID",
]
ignore = [
  "PLR0913", # domain functions legitimately take many explicit arguments
  "PLR2004", # magic values are fine in tests and rule tables
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG"]
"src/accrueboard/db/alembic/**" = ["N999"]
# Synthetic-data tooling: asserts state generator invariants, randomness is seeded and
# non-cryptographic by design, and page-drawing functions are long by nature.
"src/accrueboard/datagen/**" = ["S101", "S311", "PT018", "PLR0912", "PLR0915"]
"src/accrueboard/cli.py" = ["PLC0415"]  # subcommands import lazily to keep startup fast

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Use accrueboard.clock.Clock so time is injectable."
"datetime.datetime.utcnow".msg = "Use accrueboard.clock.Clock so time is injectable."

# ---------------------------------------------------------------- pyright
[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
strict = ["src/accrueboard/domain"]
venvPath = "."
venv = ".venv"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: needs a running Postgres (DATABASE_URL)",
]

[tool.coverage.run]
source = ["accrueboard"]
branch = true
relative_files = true

[tool.coverage.report]
skip_empty = true

# ---------------------------------------------------------------- tasks (uv run poe <task>)
[tool.poe.tasks]
fmt = [{ cmd = "ruff format . ../scripts" }, { cmd = "ruff check --fix . ../scripts" }]
lint = [{ cmd = "ruff format --check . ../scripts" }, { cmd = "ruff check . ../scripts" }]
typecheck = "pyright"
test = "pytest -m 'not integration'"
test-integration = "pytest -m integration"
guard = { cmd = "python ../scripts/check_forbidden_terms.py --all" }
migrate = "alembic -c src/accrueboard/db/alembic.ini upgrade head"
dev = "uvicorn accrueboard.api.app:create_app --factory --reload --port 8000"

[tool.poe.tasks.frontend-check]
# Python interpreter so pnpm (a .cmd shim on Windows) resolves on every platform.
interpreter = "python"
cwd = "../frontend"
shell = """
import shutil, subprocess, sys
pnpm = shutil.which("pnpm") or sys.exit("pnpm not found on PATH")
for script in ("lint", "typecheck", "test"):
    subprocess.run([pnpm, "run", script], check=True)
"""

[tool.poe.tasks.check]
sequence = ["lint", "typecheck", "test", "frontend-check", "guard"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.168.1",
    "poethepoet>=0.48.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
]
