  validation: {start: 2025-12-01, end: 2026-02-28}
  test: {start: 2026-03-01, end: 2026-08-31}

tax_rates:
  CO: "0.0881"
  UT: "0.0725"
  WY: "0.0400"
  TX: "0.0825"
  CA: "0.0725"
  NY: "0.08875"
  WA: "0.1025"
  AZ: "0.0860"

