# Synthetic client: a residential remodeling and repair contractor.
# All names, addresses and numbers are fictional.
#
# Compared with the retailer, this client has:
# - a different chart (job materials, subcontractors, equipment rental, disposal, permits,
#   work in progress)
# - lumpier amounts (subcontractor and concrete bills in the thousands), so a higher review
#   cap and capitalization threshold
# - one vendor shared with the retailer (Metro Wholesale Club), whose purchases are coded to
#   different accounts here: the knowledge store and classifier must stay per client.

id: ridgeline
name: Ridgeline Remodeling Co.
