services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: accrue
      POSTGRES_PASSWORD: accrue
      POSTGRES_DB: accrueboard
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accrue -d accrueboard"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://accrue:accrue@db:5432/accrueboard
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
